[project]
name = "pdf-pro"
version = "0.0.1"
description = "Internal R&D desktop PDF editor for AEC workflows."
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.24",
    "PyQt6>=6.6",
    "Pillow>=10.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]
ocr = [
    "pytesseract>=0.3.10",
]

[project.scripts]
pdf-pro = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
